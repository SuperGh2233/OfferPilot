name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories (non-blocking)
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-all.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node --input-type=module - "$RUNNER_TEMP/npm-audit-all.json" "$RUNNER_TEMP/npm-audit-production.json" <<'NODE'
          import { readFileSync } from "node:fs";
          for (const file of process.argv.slice(2)) {
            const report = JSON.parse(readFileSync(file, "utf8"));
            const entries = Object.entries(report.vulnerabilities ?? {});
            console.log(`\n${file}: ${entries.length} vulnerable packages`);
            for (const [name, item] of entries) {
              const via = item.via.map((entry) => typeof entry === "string" ? entry : entry.title).join("; ");
              console.log(`${item.severity.toUpperCase()} ${name} direct=${item.isDirect} range=${item.range} fix=${JSON.stringify(item.fixAvailable)} via=${via}`);
            }
          }
          NODE
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
